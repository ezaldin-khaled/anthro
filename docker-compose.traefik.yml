# Merge with prod so Traefik (same VPS / same pattern as sens/Natura) routes anthrotech.ae → Caddy.
#
# Prereq: external Docker network used by Traefik (often named "edge"):
#   docker network ls | grep edge
#
# Start:
#   docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d --build
#
# If your Traefik ACME resolver or entrypoint names differ, set in .env — see .env.example.

services:
  caddy:
    networks:
      - app
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-edge}
      - traefik.http.routers.anthro.priority=100
      - traefik.http.routers.anthro.rule=Host(`anthrotech.ae`) || Host(`www.anthrotech.ae`)
      - traefik.http.routers.anthro.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.anthro.tls=true
      - traefik.http.routers.anthro.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}
      - traefik.http.services.anthro.loadbalancer.server.port=80

networks:
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:-edge}
